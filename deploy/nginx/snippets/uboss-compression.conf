# -----------------------------------------------------------------------------
# Compression.
#
# Done here rather than in the application, on purpose. The API could compress
# its own responses, and every byte it spends doing that is a byte of a
# single-threaded event loop that could have been answering a request. nginx
# has spare capacity on this box and the API does not.
#
# The numbers that matter most are the i18n bundles: the storefront ships eight
# languages, and the Greek one is 211 kB raw and 48 kB gzipped. That is the
# difference between a usable first load on a phone and a slow one.
# -----------------------------------------------------------------------------

gzip on;
gzip_vary on;

# Proxied requests included. Without this nginx skips compression for anything
# arriving with a `Via` header, which on a deployment behind Cloudflare or any
# other CDN is everything.
gzip_proxied any;

# 5 rather than the default 1, and not 9. Compression cost climbs steeply after
# about 6 for a few percent of size; 5 is where the curve is still worth it.
gzip_comp_level 5;

# Below about a kilobyte the gzip header costs more than the saving.
gzip_min_length 1024;

gzip_types
    application/javascript
    application/json
    application/manifest+json
    application/rss+xml
    application/vnd.ms-fontobject
    application/wasm
    application/x-font-ttf
    application/xhtml+xml
    application/xml
    font/opentype
    image/svg+xml
    image/x-icon
    text/css
    text/javascript
    text/plain
    text/xml;

# Deliberately NOT compressed: images and video. JPEG, PNG, WebP and MP4 are
# already compressed, and running them through gzip spends CPU to make them
# very slightly larger.

# -----------------------------------------------------------------------------
# Brotli, where the module is installed.
#
# Roughly 15-20% smaller than gzip on JavaScript, which on a 614 kB main bundle
# and a 705 kB three.js chunk is worth having. It is NOT built into stock
# nginx, so this is commented out rather than enabled: uncommenting it without
# the module makes `nginx -t` fail and the site will not reload.
#
#   sudo apt install libnginx-mod-http-brotli-filter libnginx-mod-http-brotli-static
#
# Then uncomment. `brotli_static on` is the valuable half - it serves a
# precompiled `.br` next to the original, so the best compression is paid for
# once at build time rather than per request.
# -----------------------------------------------------------------------------
# brotli on;
# brotli_comp_level 5;
# brotli_static on;
# brotli_types
#     application/javascript
#     application/json
#     application/manifest+json
#     application/wasm
#     application/xml
#     image/svg+xml
#     text/css
#     text/javascript
#     text/plain
#     text/xml;
