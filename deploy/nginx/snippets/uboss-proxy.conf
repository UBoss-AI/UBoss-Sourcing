# -----------------------------------------------------------------------------
# What every proxied location needs.
#
# Included rather than repeated, because these are the settings where a silent
# difference between two `location` blocks produces a bug nobody can reproduce:
# one route sets Secure cookies and another does not, one logs the real client
# address and another logs 127.0.0.1.
#
# Install: sudo cp deploy/nginx/snippets/*.conf /etc/nginx/snippets/
# -----------------------------------------------------------------------------

proxy_http_version 1.1;

# Required for the keepalive pool on the upstream to be used at all. nginx
# defaults to sending `Connection: close` to upstreams, which quietly disables
# every connection the pool was holding.
proxy_set_header Connection "";

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;

# $remote_addr, NOT $proxy_add_x_forwarded_for, and the difference is a
# vulnerability rather than a preference.
#
# `$proxy_add_x_forwarded_for` APPENDS to whatever `X-Forwarded-For` the client
# sent. Fastify trusts this header in production and takes the left-most entry
# as `request.ip`, so a client that sends its own `X-Forwarded-For` CHOOSES its
# own `request.ip` - and with a fresh address per attempt it walks straight
# through the per-IP application rate limit and the per-IP login lockout.
#
# nginx is the only way in, so discarding the client's header here loses nothing
# real and closes the hole. If a CDN or another proxy is ever put in front of
# this one, do NOT go back to appending: add `set_real_ip_from <that proxy>` and
# `real_ip_header X-Forwarded-For`, which trusts the header from that address
# and from nowhere else.
#
# The edge limiter in uboss.conf uses `$binary_remote_addr` - the real peer
# address, which no header can change - and was never affected by this.
proxy_set_header X-Forwarded-For   $remote_addr;

# The one the application actually decides things from. Fastify runs with
# `trustProxy` in production and reads this to know the request arrived over
# TLS; without it every `Secure` cookie is refused by the browser and every
# absolute URL the API builds says `http://`.
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# Websocket upgrade, harmless where nothing upgrades. The preorder chat's two
# sockets (/api/v1/preorder-chats/socket and /api/v1/admin/preorder-chats/socket)
# depend on it.
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# Timeouts.
#
# 30s read is generous for this API and deliberately so: the slowest ordinary
# requests are an ERP hand-off and an assistant call, both of which talk to
# somebody else's server. The webhook location overrides this upward.
#
# A WebSocket is held to the same 30s read timeout, which is why the chat
# gateway pings every connection every 25 seconds (`HEARTBEAT_MS` in
# backend/src/modules/preorder-chat/realtime/gateway.ts): a quiet chat never
# goes 30s without upstream traffic. Shorten one and shorten the other.
proxy_connect_timeout 5s;
proxy_send_timeout    30s;
proxy_read_timeout    30s;

# Buffering off for the API.
#
# Responses here are small JSON documents, and buffering them adds a copy and a
# delay for no benefit. It also lets the API stream a large export - a GDPR
# data bundle - without nginx trying to hold the whole thing in memory first.
proxy_buffering off;
proxy_request_buffering on;

# Never let a cached API response leak between customers.
proxy_no_cache 1;
proxy_cache_bypass 1;
