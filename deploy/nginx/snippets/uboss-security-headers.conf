# -----------------------------------------------------------------------------
# Security headers for the STATIC files.
#
# The API sets its own through `@fastify/helmet` and they are stricter than
# anything here could be - `default-src 'none'` is right for a server that
# returns JSON and never HTML that runs script. These headers are for the other
# half: the single-page applications, which nginx serves off disk and which the
# API's helmet never touches.
#
# INCLUDE THIS IN EVERY LOCATION THAT SETS ANY add_header OF ITS OWN.
#
# This is the nginx rule that catches everybody once, and it catches you
# silently: **`add_header` is inherited from the parent level only if the
# current level defines no `add_header` at all.** One `add_header Cache-Control`
# in a location throws away every header from the server block - the CSP, the
# HSTS, the frame options, all of it - and nothing warns you. `nginx -t` passes.
# The page loads. The headers are simply gone.
#
# The worst case in this configuration is `location = /index.html`, which exists
# only to set a cache header and is the one document in the whole site that most
# needs a CSP. So it includes this, and so does `/assets/`, and so does
# `/media/products/`. Any new location that adds a header must too.
# -----------------------------------------------------------------------------

# Two years, with subdomains, and preload-eligible. Matches the API's own HSTS
# (`isProduction ? { maxAge: 31_536_000, includeSubDomains: true }`) rather than
# contradicting it - a shorter max-age here on the same parent domain would be
# ignored anyway, but a DIFFERENT one is the kind of disagreement that wastes an
# afternoon when somebody eventually reads both.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Features this application never uses. Denying them means a compromised
# dependency cannot quietly turn one on.
#
# `camera` and `microphone` are `self` rather than `()` on purpose: the
# storefront has image search and voice search, both of which ask the browser
# for exactly those. Denying them outright removes two working features.
add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=(self), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), interest-cohort=()" always;

# -----------------------------------------------------------------------------
# Content-Security-Policy
#
# REPORT-ONLY BY DEFAULT, AND THAT IS A DELIBERATE CHOICE RATHER THAN AN
# UNFINISHED ONE.
#
# A CSP that is one directive short does not degrade - it blanks the page, and
# it blanks it only in production, only on the real hostname, and usually only
# on the one screen nobody opened during the deploy. The policy below is
# derived from what these applications actually do, but "derived from reading
# the source" and "verified against every screen" are different things, and the
# gap between them is a storefront that cannot take an order.
#
# So it ships reporting instead of blocking. Run the site for a day with a
# browser console open - or point `report-uri` at a collector - and look at what
# it would have refused. When nothing is reported for a full day across the
# storefront, the admin panel, image search and checkout, swap the two lines at
# the bottom of this block.
#
# Why each directive is what it is:
#
#   script-src 'self'         Vite emits external, fingerprinted modules. No
#                             inline script, no eval, and three.js needs
#                             neither - it compiles shaders through the WebGL
#                             API, not through `new Function`.
#   style-src  'unsafe-inline' Unavoidable, and worth being honest about. React
#                             `style={{...}}` props become inline style
#                             ATTRIBUTES, and the greeting's backdrop and the
#                             hub's custom properties both use them heavily.
#                             `style-src-attr` narrows it to attributes only,
#                             which is the part actually needed - a stylesheet
#                             injected by an attacker is still refused.
#   img-src    data: blob:    `data:` for the inline SVG marks every category
#                             falls back to; `blob:` for the image-search
#                             preview, which is a local object URL.
#   connect-src 'self'        The API is same-origin through /api/v1. A
#                             deployment that puts the API on its own hostname
#                             has to add it here.
#   worker-src blob:          Vite emits workers as blob URLs in some builds.
#   frame-ancestors 'none'    Same as X-Frame-Options above, for browsers that
#                             prefer the modern spelling.
#   base-uri / form-action    Both 'self'. A `<base>` tag injected into the page
#                             would otherwise repoint every relative asset URL
#                             at somebody else's server.
#
# THE CARD FORM IS NOT SAME-ORIGIN, AND A POLICY OF 'self' ALONE BLOCKS IT.
#
# The storefront loads `https://js.stripe.com/v3/` at runtime and Stripe
# Elements draws the card fields inside cross-origin iframes; 3-D Secure opens a
# second one on `hooks.stripe.com`. A policy without them does not degrade to a
# plainer form - the customer gets an empty box where the card number goes. The
# origins below are Stripe's own published list (docs.stripe.com/security/guide)
# and Razorpay's loader, and they are in the shipped policy rather than in a
# comment because the alternative is that somebody enforces this on a Friday and
# discovers it at the weekend.
#
# Allowing an origin never breaks a page; omitting one does. That asymmetry is
# why these are present even in an installation that uses neither provider.
# -----------------------------------------------------------------------------

# Map background for the admin warehouse map, and anything else this particular
# installation talks to from the browser - an error tracker's ingest host, for
# example. Empty by default: the map is off until MAP_STYLE_URL, MAP_TILE_URL or
# MAP_GOOGLE_API_KEY is set, and what those point at is the operator's choice,
# so no list here could be right for everybody.
#
# Set it to the hosts you configured, scheme included. Examples:
#   set $uboss_csp_extra "https://tiles.openfreemap.org";
#   set $uboss_csp_extra "https://tile.openstreetmap.org";
#   set $uboss_csp_extra "https://maps.googleapis.com https://maps.gstatic.com";
#
# It is added to script-src, connect-src and img-src together, because a vector
# style is fetched (connect), a raster tile is an image, and the Google map is a
# script that does both.
set $uboss_csp_extra "";

set $uboss_csp "default-src 'self'; script-src 'self' https://js.stripe.com https://*.js.stripe.com https://checkout.razorpay.com $uboss_csp_extra; style-src 'self' 'unsafe-inline'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob: https://*.stripe.com $uboss_csp_extra; font-src 'self' data:; connect-src 'self' https://api.stripe.com https://*.js.stripe.com $uboss_csp_extra; frame-src 'self' https://js.stripe.com https://*.js.stripe.com https://hooks.stripe.com https://checkout.razorpay.com https://api.razorpay.com; worker-src 'self' blob:; media-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests";

# Watching. Swap these two lines once a day has passed with nothing reported.
#
# Do the swap on staging first and put a real 3-D Secure test card through it
# immediately afterwards.
#
# One thing to expect after the swap and NOT to "fix": `location
# /media/products/` includes this file and also sets its own
# `Content-Security-Policy: default-src 'none'; sandbox`, so uploaded bytes will
# carry two enforcing policies. That is correct. A browser applies both and
# takes the intersection, which for an uploaded image is the strict one -
# exactly what is wanted. Removing the strict line to tidy up the duplicate
# would let uploaded content run under the storefront's much broader policy.
#
# The Stripe origins above are published and verified;
# the Razorpay ones are read from `apps/customer-web/src/lib/razorpay.ts` and
# that provider's checkout has NOT been walked through against this policy, so
# an installation that uses Razorpay must watch the reports before enforcing.
add_header Content-Security-Policy-Report-Only $uboss_csp always;
# add_header Content-Security-Policy $uboss_csp always;
