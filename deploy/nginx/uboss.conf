# =============================================================================
# UBOSS Sourcing - nginx site configuration
#
# Three hostnames, one API. The storefront, the admin panel and the carrier
# portal are separate origins because the application already treats them as
# separate origins: `CUSTOMER_WEB_ORIGIN`, `ADMIN_WEB_ORIGIN` and
# `LOGISTICS_WEB_ORIGIN` are distinct settings, CORS is built from all three,
# and each carries screens the other two audiences must never be able to reach
# through a path on their own site.
#
# Replace `example.com` throughout, and keep these in step with the API's own
# environment or sign-in will fail in ways that look like a cookie bug:
#
#   nginx server_name          .env
#   -----------------------    ------------------------------------------
#   shop.example.com           CUSTOMER_WEB_ORIGIN, CUSTOMER_WEB_PUBLIC_URL
#   admin.example.com          ADMIN_WEB_ORIGIN, ADMIN_WEB_PUBLIC_URL
#   carriers.example.com       LOGISTICS_WEB_ORIGIN, LOGISTICS_WEB_PUBLIC_URL
#   (all three)                COOKIE_DOMAIN=.example.com
#
# `COOKIE_DOMAIN` has to be the PARENT domain with a leading dot, because one
# session cookie has to be readable on every host. Leave it empty and an
# administrator signs in on admin.example.com and is immediately signed out.
#
# The carrier portal block at the bottom only serves anything when
# FEATURE_LOGISTICS_PORTAL=true, because that is what makes `release.sh` build
# it. Leaving the block in place on an installation that does not use couriers
# is harmless - it answers 404 - but do not point DNS at it until the feature
# is on.
#
# Install:
#   sudo cp deploy/nginx/uboss.conf /etc/nginx/sites-available/uboss.conf
#   sudo ln -s /etc/nginx/sites-available/uboss.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS is left to certbot, which rewrites the `listen 443` blocks in place:
#   sudo certbot --nginx -d shop.example.com -d admin.example.com \
#                         -d carriers.example.com
# =============================================================================

# -----------------------------------------------------------------------------
# The API instances
#
# One systemd unit per port - see deploy/systemd/uboss-api@.service. Three on a
# four-core box, leaving a core for nginx, MariaDB and the worker, which are not
# idle. Node is single-threaded per process, so an API on one port uses exactly
# one core however much traffic arrives; instances are the only way to use the
# rest.
#
# `least_conn` rather than round-robin because request cost here is wildly
# uneven - a catalogue read is a millisecond and a checkout is a transaction.
# Round-robin hands an instance a new request while it is still inside a
# payment write; least_conn sends it to whichever instance is actually free.
#
# `keepalive` is the setting people leave out and then wonder where their
# latency went: without it nginx opens a fresh TCP connection to the API for
# every single request, and a local TCP handshake is a real fraction of the
# response time for a request the API answers in two milliseconds.
# -----------------------------------------------------------------------------
upstream uboss_api {
    least_conn;

    server 127.0.0.1:4000 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:4001 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:4002 max_fails=3 fail_timeout=10s;

    keepalive 64;
    keepalive_timeout 60s;
}

# -----------------------------------------------------------------------------
# Shared proxy behaviour
#
# `X-Forwarded-Proto` is not decoration. The API runs with Fastify's
# `trustProxy` on in production, and it decides from this header whether the
# request arrived over TLS. Omit it and every `Secure` cookie the API sets is
# refused by the browser, and every absolute URL it builds says `http://`.
# -----------------------------------------------------------------------------
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# -----------------------------------------------------------------------------
# Rate limiting at the edge
#
# The API has its own limiter (`@fastify/rate-limit`) and this does not replace
# it - it sits in front of it. The difference matters: the application's limiter
# runs AFTER a request has been parsed, routed and given a database connection,
# so a flood still costs real work. This one costs a hash lookup.
#
# Generous, because it is a blunt instrument guarding against floods rather than
# a policy: the per-account and per-route rules belong in the application, which
# knows who is asking.
# -----------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=uboss_api_zone:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=uboss_auth_zone:10m rate=5r/s;

# =============================================================================
# HTTP -> HTTPS
#
# Everything except the ACME challenge, which has to answer on port 80 for
# certbot to renew.
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name shop.example.com admin.example.com carriers.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# =============================================================================
# The storefront
# =============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name shop.example.com;

    # certbot fills these in. Left as placeholders so `nginx -t` fails loudly
    # on a box where the certificate was never issued, rather than serving
    # something unencrypted.
    ssl_certificate     /etc/letsencrypt/live/shop.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shop.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    root /srv/uboss/current/customer-web;
    index index.html;

    # Must exceed UPLOAD_MAX_BYTES in .env (5 MB by default). nginx refuses
    # the body before the API ever sees it, and its refusal is a bare 413 with
    # no error code - so keep this ABOVE the application's limit and let the
    # application produce the message a person reads.
    client_max_body_size 8m;

    include /etc/nginx/snippets/uboss-security-headers.conf;
    include /etc/nginx/snippets/uboss-compression.conf;

    # -------------------------------------------------------------------------
    # The API
    # -------------------------------------------------------------------------
    location /api/v1/ {
        limit_req zone=uboss_api_zone burst=60 nodelay;
        include /etc/nginx/snippets/uboss-proxy.conf;
        proxy_pass http://uboss_api;
    }

    # Sign-in, registration and password reset, held to a tighter rate.
    # Credential stuffing is a flood of well-formed requests, which is exactly
    # what the generous limit above is designed to let through.
    # Every sign-in path, not only the storefront's.
    #
    # This regex used to be `^/api/v1/auth/(login|register|password)`, which
    # matches the CUSTOMER surface and nothing else. The admin console signs in
    # at /api/v1/admin/auth/login and the carrier portal at
    # /api/v1/logistics/auth/login, so the two accounts that can refund an
    # order or move a consignment were the two held to the general 30r/s rather
    # than to 5r/s. The application's own per-route limiter covered them, which
    # is why nothing broke; the edge limit is the layer that keeps a credential
    # flood off the Node process entirely, and it was missing exactly where it
    # mattered most.
    location ~ ^/api/v1/(admin/|logistics/)?auth/(login|register|password) {
        limit_req zone=uboss_auth_zone burst=10 nodelay;
        include /etc/nginx/snippets/uboss-proxy.conf;
        proxy_pass http://uboss_api;
    }

    # -------------------------------------------------------------------------
    # Payment webhooks
    #
    # Never rate limited, and this is deliberate. An order reaches CONFIRMED
    # only through a signature-verified webhook; a provider whose delivery we
    # refuse with a 429 retries for a while and then gives up, and the customer
    # has been charged for an order that never confirms. The signature is the
    # control here, and it is a better one than an IP bucket.
    # -------------------------------------------------------------------------
    # The route is `/payments/webhooks/:provider`, so the real paths are
    # `/api/v1/payments/webhooks/razorpay` and `.../stripe`. Spelled with the
    # trailing slash rather than as a shorter prefix: `/api/v1/payments/webhook`
    # would match these by accident and would also match anything else starting
    # with those characters, which is an exemption from rate limiting granted to
    # a URL nobody meant to grant it to.
    location /api/v1/payments/webhooks/ {
        include /etc/nginx/snippets/uboss-proxy.conf;
        # Providers can be slow to release the connection; this must not be
        # shorter than the API's own processing window. Stripe also rejects a
        # delivery signed more than five minutes ago, so a queue here turns
        # into signature failures - see RUNBOOK.md §7.
        proxy_read_timeout 60s;
        proxy_pass http://uboss_api;
    }

    # -------------------------------------------------------------------------
    # Uploaded product images
    #
    # READ THIS BEFORE ASSUMING IT APPLIES. **The API refuses to start in
    # production with `STORAGE_DRIVER=local`** - "local disk storage is not
    # durable; configure s3" - so on a correctly configured deployment product
    # images live in object storage and are served from whatever
    # `STORAGE_PUBLIC_BASE_URL` points at, not from here. This block is then
    # dead configuration, and harmless.
    #
    # It exists for the one arrangement where it is right: an operator running
    # MinIO or another S3-compatible service on this same machine, with
    # `STORAGE_PUBLIC_BASE_URL` pointing back at this host. See
    # docs/DEPLOYMENT.md, "Where product images live", for that trade-off - it
    # satisfies the driver without satisfying the reason the driver exists.
    #
    # Where it does apply, nginx reads the files directly rather than proxying,
    # which is the single biggest throughput win available on this box: a
    # product page pulls a dozen images, and every one of them proxied is a
    # Node event-loop turn that could have been serving a checkout.
    #
    # The three headers are NOT optional and are copied from the API's own
    # static handler. Uploaded bytes must never execute or render as a document
    # in this origin, whatever a browser decides to sniff them as. Changing the
    # API's handler without changing this leaves a hole that only appears in
    # production.
    # -------------------------------------------------------------------------
    location /media/products/ {
        alias /srv/uboss/media/products/;

        include /etc/nginx/snippets/uboss-security-headers.conf;
        add_header Content-Disposition "inline" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header Cache-Control "public, max-age=604800" always;

        # A missing image is a missing image, not the storefront's index.html
        # with a 200 - which is what the SPA fallback below would otherwise do
        # to every broken image on the site.
        try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # Health and metrics
    #
    # `/health/live` and `/health/ready` are open: an uptime check has no
    # session, and they disclose a status and a latency.
    #
    # `/metrics` is NOT. It is a Prometheus endpoint the application
    # deliberately leaves unauthenticated, and its own source says so: "in
    # production it belongs on an internal port or behind a network policy,
    # which is a deployment concern rather than a code one." This is that
    # deployment concern being handled. It exposes route-level latencies and
    # counts - no customer data, but a precise map of what this installation
    # does and how heavily.
    # -------------------------------------------------------------------------
    location /health/ {
        access_log off;
        include /etc/nginx/snippets/uboss-proxy.conf;
        proxy_pass http://uboss_api;
    }

    location = /metrics {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        include /etc/nginx/snippets/uboss-proxy.conf;
        proxy_pass http://uboss_api;
    }

    # -------------------------------------------------------------------------
    # The single-page application
    #
    # Vite fingerprints every file under /assets, so those are immutable for a
    # year: the name changes when the contents change, and a returning visitor
    # revalidates nothing. `index.html` is the opposite and must NEVER be
    # cached, because it is the only file that names the current fingerprints -
    # a cached one points a browser at the previous release's chunks, which
    # were deleted, and the site goes blank for exactly the people who visit
    # most often.
    # -------------------------------------------------------------------------
    # How somebody tells you they found a hole.
    #
    # RFC 9116. A researcher or a scanner looks here FIRST, and an absent file
    # reads as "there is nobody to tell" - which is how a finding ends up on a
    # mailing list instead of in your inbox. The file is not shipped filled
    # in, because the contact address belongs to whoever runs this
    # installation: copy deploy/nginx/security.txt.example into the web root
    # and fill in the three fields it names.
    #
    # Served with no cache header of its own, so `Expires:` inside the file
    # is the only thing that decides when it goes stale, and outside the CSP
    # `location` blocks because it is plain text that runs nothing.
    location = /.well-known/security.txt {
        default_type text/plain;
        access_log off;
        try_files $uri =404;
    }

    # Source maps, if one ever reaches the server.
    #
    # Both release paths already delete them - `release.sh` and the deploy
    # workflow each run `find dist -name '*.map' -delete` - so on a correct
    # release this block matches nothing. It is here for the release that was
    # not correct: a `npm run build` run by hand on the box, a half-copied
    # dist, a rollback to an older tree. A map is the complete TypeScript
    # source of the admin console, route names and permission keys included,
    # and "we remembered to delete it" is a weaker guarantee than "it is not
    # served".
    #
    # Before /assets/ below, because nginx takes the longest matching PREFIX
    # location but a regex location wins over any prefix it overlaps.
    location ~* \.map$ {
        access_log off;
        return 404;
    }

    location /assets/ {
        expires 1y;
        include /etc/nginx/snippets/uboss-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/snippets/uboss-security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# =============================================================================
# The admin panel
#
# A separate host rather than a path on the storefront, and it is worth being
# explicit about why: a path would put the admin bundle on the same origin as
# the shop, where any storefront XSS reaches it, and would make the two
# impossible to firewall apart later. On its own host it can be restricted to
# an office address range with two lines, which is the first thing most
# operators want and cannot retrofit onto a path.
# =============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name admin.example.com;

    ssl_certificate     /etc/letsencrypt/live/admin.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /srv/uboss/current/admin-web;
    index index.html;

    client_max_body_size 8m;

    include /etc/nginx/snippets/uboss-security-headers.conf;
    include /etc/nginx/snippets/uboss-compression.conf;

    # Uncomment to restrict the whole panel to known addresses. Staff sign-in
    # is still required underneath; this only decides who may knock.
    #
    # allow 203.0.113.0/24;
    # deny all;

    # Search engines must never index an admin panel, and `robots.txt` is not
    # enough on a host that also answers the SPA fallback for every path.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location /api/v1/ {
        limit_req zone=uboss_api_zone burst=60 nodelay;
        include /etc/nginx/snippets/uboss-proxy.conf;
        proxy_pass http://uboss_api;
    }

    # Every sign-in path, not only the storefront's.
    #
    # This regex used to be `^/api/v1/auth/(login|register|password)`, which
    # matches the CUSTOMER surface and nothing else. The admin console signs in
    # at /api/v1/admin/auth/login and the carrier portal at
    # /api/v1/logistics/auth/login, so the two accounts that can refund an
    # order or move a consignment were the two held to the general 30r/s rather
    # than to 5r/s. The application's own per-route limiter covered them, which
    # is why nothing broke; the edge limit is the layer that keeps a credential
    # flood off the Node process entirely, and it was missing exactly where it
    # mattered most.
    location ~ ^/api/v1/(admin/|logistics/)?auth/(login|register|password) {
        limit_req zone=uboss_auth_zone burst=10 nodelay;
        include /etc/nginx/snippets/uboss-proxy.conf;
        proxy_pass http://uboss_api;
    }

    location /media/products/ {
        alias /srv/uboss/media/products/;
        include /etc/nginx/snippets/uboss-security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Content-Disposition "inline" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        try_files $uri =404;
    }

    location /health/ {
        access_log off;
        include /etc/nginx/snippets/uboss-proxy.conf;
        proxy_pass http://uboss_api;
    }

    # How somebody tells you they found a hole.
    #
    # RFC 9116. A researcher or a scanner looks here FIRST, and an absent file
    # reads as "there is nobody to tell" - which is how a finding ends up on a
    # mailing list instead of in your inbox. The file is not shipped filled
    # in, because the contact address belongs to whoever runs this
    # installation: copy deploy/nginx/security.txt.example into the web root
    # and fill in the three fields it names.
    #
    # Served with no cache header of its own, so `Expires:` inside the file
    # is the only thing that decides when it goes stale, and outside the CSP
    # `location` blocks because it is plain text that runs nothing.
    location = /.well-known/security.txt {
        default_type text/plain;
        access_log off;
        try_files $uri =404;
    }

    # Source maps, if one ever reaches the server.
    #
    # Both release paths already delete them - `release.sh` and the deploy
    # workflow each run `find dist -name '*.map' -delete` - so on a correct
    # release this block matches nothing. It is here for the release that was
    # not correct: a `npm run build` run by hand on the box, a half-copied
    # dist, a rollback to an older tree. A map is the complete TypeScript
    # source of the admin console, route names and permission keys included,
    # and "we remembered to delete it" is a weaker guarantee than "it is not
    # served".
    #
    # Before /assets/ below, because nginx takes the longest matching PREFIX
    # location but a regex location wins over any prefix it overlaps.
    location ~* \.map$ {
        access_log off;
        return 404;
    }

    location /assets/ {
        expires 1y;
        include /etc/nginx/snippets/uboss-security-headers.conf;
        # Repeated here for the same reason the include is: a level that sets
        # any add_header of its own inherits none of the parent's, so the
        # server block's noindex would be silently dropped on exactly the files
        # a crawler follows first.
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/snippets/uboss-security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# =============================================================================
# The logistics (carrier) portal
#
# A THIRD hostname rather than a path, and for a stronger reason than the admin
# panel has: the people who sign in here do not work for you. A dispatcher at a
# courier company is not a customer of this shop and must never be able to
# reach a cart, a price or a payment method - the API enforces that with a
# separate `users.type` and a token audience claim, and a separate origin is
# the same boundary drawn where a person can see it.
#
# ONLY SERVED WHEN THE FEATURE IS ON. `release.sh` builds this application only
# when FEATURE_LOGISTICS_PORTAL=true, so on an installation with no third-party
# couriers `/srv/uboss/current/logistics-web` does not exist and this block
# answers 404 for everything. That is the correct behaviour, not a fault - but
# it is also why you should not point DNS at it before turning the feature on,
# or the first thing a carrier sees is an empty site.
#
# Keep these in step or sign-in fails in ways that look like a cookie bug:
#
#   nginx server_name          .env
#   -----------------------    ------------------------------------------
#   carriers.example.com       LOGISTICS_WEB_ORIGIN, LOGISTICS_WEB_PUBLIC_URL
#   (all three hosts)          COOKIE_DOMAIN=.example.com
# =============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name carriers.example.com;

    ssl_certificate     /etc/letsencrypt/live/carriers.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/carriers.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /srv/uboss/current/logistics-web;
    index index.html;

    # Proof-of-delivery photographs and signed paperwork come in through here,
    # so this must stay above UPLOAD_MAX_BYTES like the other two hosts.
    client_max_body_size 8m;

    include /etc/nginx/snippets/uboss-security-headers.conf;
    include /etc/nginx/snippets/uboss-compression.conf;

    # A carrier portal must never be indexed, and robots.txt is not enough on a
    # host that answers the SPA fallback for every path.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # Uncomment to restrict the portal to your carriers' known addresses.
    # Carrier sign-in is still required underneath; this only decides who may
    # knock. Rarely practical - drivers are on mobile networks - which is why
    # it is off by default here and on by default in nobody's config.
    #
    # allow 203.0.113.0/24;
    # deny all;

    location /api/v1/ {
        limit_req zone=uboss_api_zone burst=60 nodelay;
        include /etc/nginx/snippets/uboss-proxy.conf;
        proxy_pass http://uboss_api;
    }

    # Every sign-in path, not only the storefront's.
    #
    # This regex used to be `^/api/v1/auth/(login|register|password)`, which
    # matches the CUSTOMER surface and nothing else. The admin console signs in
    # at /api/v1/admin/auth/login and the carrier portal at
    # /api/v1/logistics/auth/login, so the two accounts that can refund an
    # order or move a consignment were the two held to the general 30r/s rather
    # than to 5r/s. The application's own per-route limiter covered them, which
    # is why nothing broke; the edge limit is the layer that keeps a credential
    # flood off the Node process entirely, and it was missing exactly where it
    # mattered most.
    location ~ ^/api/v1/(admin/|logistics/)?auth/(login|register|password) {
        limit_req zone=uboss_auth_zone burst=10 nodelay;
        include /etc/nginx/snippets/uboss-proxy.conf;
        proxy_pass http://uboss_api;
    }

    # Carrier webhooks. Never rate limited, for the same reason the payment
    # webhooks are not: a carrier whose delivery we refuse with a 429 retries
    # for a while and then gives up, and a consignment silently stops updating.
    # The signature is the control here, not an IP bucket.
    location /api/v1/logistics/webhooks/ {
        include /etc/nginx/snippets/uboss-proxy.conf;
        proxy_read_timeout 60s;
        proxy_pass http://uboss_api;
    }

    location /health/ {
        access_log off;
        include /etc/nginx/snippets/uboss-proxy.conf;
        proxy_pass http://uboss_api;
    }

    # How somebody tells you they found a hole.
    #
    # RFC 9116. A researcher or a scanner looks here FIRST, and an absent file
    # reads as "there is nobody to tell" - which is how a finding ends up on a
    # mailing list instead of in your inbox. The file is not shipped filled
    # in, because the contact address belongs to whoever runs this
    # installation: copy deploy/nginx/security.txt.example into the web root
    # and fill in the three fields it names.
    #
    # Served with no cache header of its own, so `Expires:` inside the file
    # is the only thing that decides when it goes stale, and outside the CSP
    # `location` blocks because it is plain text that runs nothing.
    location = /.well-known/security.txt {
        default_type text/plain;
        access_log off;
        try_files $uri =404;
    }

    # Source maps, if one ever reaches the server.
    #
    # Both release paths already delete them - `release.sh` and the deploy
    # workflow each run `find dist -name '*.map' -delete` - so on a correct
    # release this block matches nothing. It is here for the release that was
    # not correct: a `npm run build` run by hand on the box, a half-copied
    # dist, a rollback to an older tree. A map is the complete TypeScript
    # source of the admin console, route names and permission keys included,
    # and "we remembered to delete it" is a weaker guarantee than "it is not
    # served".
    #
    # Before /assets/ below, because nginx takes the longest matching PREFIX
    # location but a regex location wins over any prefix it overlaps.
    location ~* \.map$ {
        access_log off;
        return 404;
    }

    location /assets/ {
        expires 1y;
        # Repeated because a level that sets any add_header of its own inherits
        # none of the parent's - so the server block's noindex would be
        # silently dropped on exactly the files a crawler follows first.
        include /etc/nginx/snippets/uboss-security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/snippets/uboss-security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
