# =============================================================================
# Static analysis.
#
# Kept in its own file rather than as a job in ci.yml for one practical reason:
# on a PRIVATE repository CodeQL needs GitHub Advanced Security, and without it
# this workflow fails at the `init` step with a licensing error. That is a red
# mark on a setting, not on the code, and it should not be mixed in with the red
# mark that means a test failed.
#
# If this repository is private and does not have Advanced Security, disable
# this workflow in the Actions settings rather than deleting it - the day the
# repository becomes public, or the licence is bought, is the day you want it
# back.
#
# The schedule matters as much as the pull-request trigger: most findings here
# arrive because a new query was published, not because somebody wrote new code.
# =============================================================================
name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Monday, early. A weekly run against unchanged code is the point.
    - cron: '17 4 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-24.04

    # OFF UNTIL SOMEBODY TURNS IT ON, and the switch is one repository variable:
    #
    #   Settings -> Secrets and variables -> Actions -> Variables
    #   ENABLE_CODEQL = true
    #
    # Because on a PRIVATE repository CodeQL needs GitHub Advanced Security, and
    # without it `init` fails with a licensing error on every push. That is a red
    # mark about a billing setting, sitting next to the red marks that mean a
    # test broke - and the fastest way to make people stop reading CI results is
    # to leave one there that nobody can fix by changing code.
    #
    # A skipped job says "not run", which is true. `continue-on-error` would say
    # "passed", which would not be.
    if: vars.ENABLE_CODEQL == 'true'

    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # security-extended over the default: this application takes card
          # payments and holds personal data, so the extra queries - including
          # the ones about server-side request forgery and unsafe deserialisation
          # - are the ones worth the extra minutes.
          queries: security-extended

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript
