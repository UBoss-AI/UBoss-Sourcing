# =============================================================================
# Static analysis.
#
# This is mandatory. For a private repository, enable GitHub Advanced Security
# before the first protected-branch merge; a licensing/configuration failure is
# intentionally visible instead of silently skipping static analysis.
#
# The schedule matters as much as the pull-request trigger: most findings here
# arrive because a new query was published, not because somebody wrote new code.
# =============================================================================
name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Monday, early. A weekly run against unchanged code is the point.
    - cron: '17 4 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@ed1a0fa18ac745d017ca370dd4ef08bba3b4f504 # v3
        with:
          languages: javascript-typescript
          # security-extended over the default: this application takes card
          # payments and holds personal data, so the extra queries - including
          # the ones about server-side request forgery and unsafe deserialisation
          # - are the ones worth the extra minutes.
          queries: security-extended

      - uses: github/codeql-action/analyze@ed1a0fa18ac745d017ca370dd4ef08bba3b4f504 # v3
        with:
          category: /language:javascript-typescript
