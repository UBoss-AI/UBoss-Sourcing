# =============================================================================
# The gate between a commit and a release.
#
# Everything here can be run by hand - it is the same `npm run verify` a
# developer runs before committing. The value is not that it is clever, it is
# that it cannot be skipped, and that it runs against a MariaDB configured the
# way production is rather than the way XAMPP is.
#
# THE ONE DIFFERENCE FROM A DEVELOPER'S MACHINE, AND IT MATTERS
#
# Development runs MariaDB 10.4.32 out of XAMPP, which went out of support in
# June 2024 and is not strict. Production runs 11.4 LTS, which is both
# supported and strict: a value too long for its column is truncated with a
# warning on one and rejected with an error on the other. This workflow uses
# the exact production patch so that the difference surfaces here rather than
# on launch night.
#
# The version is PINNED, not floating. `mariadb:11.4` moves every time a patch
# ships, and a CI run whose database changed under it has not tested what the
# last one tested. When production is upgraded, this changes in the same commit
# - see docs/DATABASE-PRODUCTION.md section 3.
# =============================================================================
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push to the same branch makes the first run pointless. Not for main,
# where every commit's result is worth keeping.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # The API, its migrations and its tests
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (typecheck, lint, tests)
    runs-on: ubuntu-24.04

    services:
      mariadb:
        # The exact patch production runs. Kept in step with
        # deploy/compat/docker-compose.yml, which pins the same image by digest
        # for the local rehearsal.
        image: mariadb:11.4.13
        env:
          MARIADB_ROOT_PASSWORD: ci-root-not-a-secret
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
        ports:
          - 3306:3306

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # TWO databases, and this is not tidiness.
      #
      # tests/setup.ts refuses to run when TEST_DATABASE_URL and DATABASE_URL
      # are the same string, because the integration suite truncates every
      # table it touches. One database here would mean either a refused test run
      # or - worse, if the guard were ever relaxed - a suite that wipes the
      # database it is meant to be testing against.
      # The client is installed rather than assumed. The runner image's MySQL
      # client has come and gone between Ubuntu versions, and a workflow that
      # depends on whatever happens to be baked in fails one morning for a
      # reason that has nothing to do with the commit.
      - name: Install the MariaDB client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mariadb-client

      - name: Create the two databases
        run: |
          mariadb -h 127.0.0.1 -P 3306 -uroot -pci-root-not-a-secret -e "
            CREATE DATABASE uboss      CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
            CREATE DATABASE uboss_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
            SELECT @@version, @@sql_mode;"

      # The committed example, with the three values that cannot be placeholders.
      #
      # SECRETS_ENCRYPTION_KEY is checked in every environment, not just
      # production: env.ts refuses to start unless it decodes to exactly 32
      # bytes. The signing secrets are only rejected as placeholders when
      # NODE_ENV=production, and this is not, but they are generated anyway so
      # that nothing in CI is ever signed with a value that is in the repository.
      - name: Write the CI environment file
        working-directory: backend
        run: |
          cp .env.example .env
          {
            echo "DATABASE_URL=mysql://root:ci-root-not-a-secret@127.0.0.1:3306/uboss"
            echo "TEST_DATABASE_URL=mysql://root:ci-root-not-a-secret@127.0.0.1:3306/uboss_test"
            echo "SECRETS_ENCRYPTION_KEY=$(openssl rand -base64 32)"
            echo "SESSION_COOKIE_SECRET=$(openssl rand -base64 36)"
            echo "ACCESS_TOKEN_SECRET=$(openssl rand -base64 36)"
            echo "REFRESH_TOKEN_SECRET=$(openssl rand -base64 36)"
          } >> .env

      - name: Install
        working-directory: backend
        run: npm ci

      # npm 11 skips a dependency's install script unless package.json lists it
      # in `allowScripts`, and it skips it with a warning and exit 0. argon2 is
      # a native addon and @prisma/engines downloads the query engine, so
      # without their scripts the install "succeeds" and nothing works.
      #
      # Checked here rather than left to the test run: the symptom otherwise is
      # a wall of failures four minutes later that look like application bugs.
      # `release.sh` makes the same two checks before it swaps a release.
      - name: The install actually built what it needed to
        working-directory: backend
        run: |
          node -e "require('argon2')" \
            || { echo "::error::argon2 has no native binding - npm skipped its build script. Run 'npm install-scripts ls' in backend/ and approve it."; exit 1; }
          npx prisma --version >/dev/null \
            || { echo "::error::Prisma engines missing - npm skipped @prisma/engines' postinstall. Same fix."; exit 1; }
          npm install-scripts ls

      - name: Generate the Prisma client
        working-directory: backend
        run: npx prisma generate

      # `migrate deploy`, never `migrate dev`. `dev` rewrites migration files and
      # offers to reset the database; in this repository it also renames eighteen
      # foreign keys and drops defaults, which would then show up as a diff
      # nobody asked for.
      #
      # Both databases. A migration applied only to `uboss` is exactly the shape
      # of failure that produces ninety sign-in 500s in the test suite and no
      # explanation.
      - name: Migrate both databases
        working-directory: backend
        run: |
          DATABASE_URL="mysql://root:ci-root-not-a-secret@127.0.0.1:3306/uboss" \
            npx prisma migrate deploy
          DATABASE_URL="mysql://root:ci-root-not-a-secret@127.0.0.1:3306/uboss_test" \
            npx prisma migrate deploy

      # Proves the committed migrations and the committed schema agree. A schema
      # edited without a migration passes every test on a developer's machine -
      # their database already has the column - and fails on a fresh one.
      - name: Migrations match the schema
        working-directory: backend
        run: npx prisma migrate status
        env:
          DATABASE_URL: mysql://root:ci-root-not-a-secret@127.0.0.1:3306/uboss

      # `migrate status` proves the migrations have all been applied. It does
      # NOT prove they produce what schema.prisma describes, and those are
      # different things: an index created by a migration and never declared
      # here, or declared here and never migrated, passes `status` and shows up
      # as a surprise migration the next time anybody runs `migrate dev`.
      #
      # Exit 2 means "there is a difference", which is the failure. Exit 1 means
      # the command could not run, which is also a failure but a different one -
      # so the two are separated rather than both read as drift.
      - name: The migrations and schema.prisma agree
        working-directory: backend
        env:
          DATABASE_URL: mysql://root:ci-root-not-a-secret@127.0.0.1:3306/uboss
        run: |
          set +e
          npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code >/dev/null 2>&1
          code=$?
          set -e
          case "$code" in
            0) echo "No difference." ;;
            2) echo "::error::The committed migrations and schema.prisma disagree. The differences:"
               npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma
               echo "::error::Reconcile this WITHOUT rewriting migration history - docs/DATABASE-MIGRATION.md section 5. Do not run 'prisma migrate dev' to fix it."
               exit 1 ;;
            *) echo "::error::prisma migrate diff could not run (exit $code)."; exit 1 ;;
          esac

      # A migration that DROPs is not forbidden - the expand-and-contract
      # pattern ends with one - but it must never reach production because
      # nobody looked. This lists them so that a reviewer sees them on the pull
      # request, and fails only when one appears in a migration that is new on
      # this branch.
      - name: Destructive migrations are declared, not discovered
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          new_migrations=$(git diff --name-only --diff-filter=A "origin/${{ github.base_ref }}"...HEAD -- 'backend/prisma/migrations/**/migration.sql' || true)
          if [ -z "$new_migrations" ]; then echo "No new migrations on this branch."; exit 0; fi
          echo "New migrations on this branch:"; echo "$new_migrations"
          destructive=$(grep -lniE '^\s*(DROP (TABLE|COLUMN|DATABASE)|ALTER TABLE .* DROP |TRUNCATE)' $new_migrations || true)
          if [ -n "$destructive" ]; then
            echo "::warning::These migrations remove schema or data:"
            echo "$destructive"
            grep -niE '^\s*(DROP (TABLE|COLUMN|DATABASE)|ALTER TABLE .* DROP |TRUNCATE)' $destructive
            echo "::warning::That is allowed - the contract half of expand-and-contract is exactly this - but it must be deliberate."
            echo "::warning::Confirm in the pull request that the column is unread by BOTH the running release and this one, and that a backup exists. docs/DATABASE-MIGRATION.md section 11."
          else
            echo "No destructive statements in the new migrations."
          fi

      # The least-privilege model, exercised on every pull request.
      #
      # `audit_logs` is append-only by database grant, and the grant has to be
      # generated per table because MariaDB will not revoke a table-level
      # privilege that was granted at database level. That generator reads the
      # table list from the database, so a migration that adds a table changes
      # its output - which means it is exactly the kind of thing that breaks
      # silently and is only noticed in production.
      - name: The application account cannot rewrite its own audit log
        working-directory: backend
        run: |
          mariadb -h 127.0.0.1 -uroot -pci-root-not-a-secret -e "
            CREATE USER 'uboss_app'@'%' IDENTIFIED BY 'ci-app-not-a-secret';
            GRANT SELECT, INSERT ON uboss.* TO 'uboss_app'@'%';"

          printf "SET @app_user='uboss_app'; SET @app_host='%%';\n" \
            | cat - ../deploy/mariadb/post-migrate-grants.sql \
            | mariadb -h 127.0.0.1 -uroot -pci-root-not-a-secret -N -B uboss \
            | mariadb -h 127.0.0.1 -uroot -pci-root-not-a-secret -B uboss

          # Reading is fine. Rewriting history is not, and neither is DDL.
          mariadb -h 127.0.0.1 -uuboss_app -pci-app-not-a-secret -e "SELECT COUNT(*) FROM audit_logs;" uboss >/dev/null \
            || { echo "::error::uboss_app cannot read audit_logs - the grants are too tight."; exit 1; }

          if mariadb -h 127.0.0.1 -uuboss_app -pci-app-not-a-secret -e "UPDATE audit_logs SET action='x' WHERE 1=0;" uboss 2>/dev/null; then
            echo "::error::uboss_app can UPDATE audit_logs. The audit trail is not append-only."
            exit 1
          fi
          if mariadb -h 127.0.0.1 -uuboss_app -pci-app-not-a-secret -e "DELETE FROM audit_logs WHERE 1=0;" uboss 2>/dev/null; then
            echo "::error::uboss_app can DELETE from audit_logs. The audit trail is not append-only."
            exit 1
          fi
          if mariadb -h 127.0.0.1 -uuboss_app -pci-app-not-a-secret -e "CREATE TABLE ci_should_not_exist (id INT);" uboss 2>/dev/null; then
            echo "::error::uboss_app can create tables. The runtime account has DDL rights it must not have."
            exit 1
          fi
          # ...and it must still be able to do its actual job.
          mariadb -h 127.0.0.1 -uuboss_app -pci-app-not-a-secret -e "UPDATE orders SET internalNote=internalNote WHERE 1=0;" uboss \
            || { echo "::error::uboss_app cannot UPDATE orders - apply-grants missed a table."; exit 1; }
          echo "audit_logs is append-only; DDL is denied; ordinary writes still work."

      # The validation query set, against the freshly migrated (empty) database.
      # On an empty schema every check must be zero, so this is a cheap proof
      # that none of the queries has drifted away from a renamed column - which
      # is how a data-validation script quietly stops validating anything.
      - name: The data-validation queries still run
        working-directory: backend
        run: |
          mariadb -h 127.0.0.1 -uroot -pci-root-not-a-secret -N -B uboss \
            < ../scripts/db/validate-data.sql > /tmp/validation.tsv
          failures=$(awk -F'\t' '$3 == "0" && $2 != "0" { print $1" = "$2 }' /tmp/validation.tsv)
          if [ -n "$failures" ]; then
            echo "::error::Validation checks failed against an empty migrated database:"
            echo "$failures"
            exit 1
          fi
          echo "$(wc -l < /tmp/validation.tsv) checks ran, all clean."

      # Split into three, deliberately.
      #
      # `npm run verify` is one command and therefore one step, and a failed
      # step tells the API only that "Verify" failed - not whether the types,
      # the lint or the tests did. Job logs need admin rights on the repository,
      # so for anybody without them a red mark here carried almost no
      # information. Three steps cost nothing and name the half of the problem
      # that is otherwise a guess.
      - name: Typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Tests
        working-directory: backend
        run: npm test -- --reporter=default --reporter=json --outputFile.json=vitest-report.json

      # The failing test names, readable without admin rights.
      #
      # The report holds test names, files and error messages - no environment,
      # no secrets; the suite's credentials are the fake ones pinned in
      # tests/setup.ts.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: vitest-report
          path: backend/vitest-report.json
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------------
  # The three front ends
  #
  # `npm run verify` differs slightly between them - the admin panel has no test
  # script, the other two do - so each runs its own rather than a list assembled
  # here that would drift out of step with their package.json files.
  # ---------------------------------------------------------------------------
  frontends:
    name: ${{ matrix.app }}
    runs-on: ubuntu-24.04

    strategy:
      # One failing application should not hide the state of the other two.
      fail-fast: false
      matrix:
        app: [customer-web, admin-web, logistics-web]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - name: Install
        working-directory: apps/${{ matrix.app }}
        run: npm ci

      # typecheck, lint, the contrast audit (accessibility evidence - see
      # docs/DEPLOYMENT.md section 19), tests where they exist, and the build.
      - name: Verify
        working-directory: apps/${{ matrix.app }}
        run: npm run verify

      # Source maps are generated deliberately and must never be published;
      # release.sh deletes them before assembling a release. This is the check
      # that the build still produces what that step expects to find.
      - name: Report bundle size
        working-directory: apps/${{ matrix.app }}
        run: du -sh dist && find dist -name '*.map' | wc -l

  # ---------------------------------------------------------------------------
  # Supply chain
  #
  # Separate from the build so that a new advisory published overnight shows as
  # its own red mark rather than as "the frontend build failed".
  # ---------------------------------------------------------------------------
  audit:
    name: Dependency audit (${{ matrix.slug }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        # `slug` exists because an uploaded artifact's name cannot contain a
        # slash, and `apps/customer-web` does.
        include:
          - project: backend
            slug: backend
          - project: apps/customer-web
            slug: customer-web
          - project: apps/admin-web
            slug: admin-web
          - project: apps/logistics-web
            slug: logistics-web

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # High and critical only. Blocking on `low` trains everybody to ignore
      # this job, which costs more than the advisories it would have caught.
      - name: npm audit
        working-directory: ${{ matrix.project }}
        run: npm audit --audit-level=high

      # A software bill of materials, kept for 90 days. It is what answers "were
      # we running the affected version on the day of the advisory?" - and it is
      # an input to the Cyber Resilience Act work in docs/DEPLOYMENT.md §7.
      - name: SBOM
        if: always()
        working-directory: ${{ matrix.project }}
        run: |
          npm ci --ignore-scripts
          npm sbom --sbom-format cyclonedx > sbom.cdx.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom-${{ matrix.slug }}
          path: ${{ matrix.project }}/sbom.cdx.json
          # The audit above can fail before the SBOM is written. That is a
          # missing artifact, not a second failure to report.
          if-no-files-found: warn
          retention-days: 90

  # ---------------------------------------------------------------------------
  # Secrets
  #
  # The whole history, not the diff: a secret committed and then removed is
  # still in the history, still fetchable by anyone who has ever cloned, and
  # still valid until it is rotated. `fetch-depth: 0` is what makes that
  # possible.
  #
  # The released binary rather than the marketplace action, which wants a paid
  # licence key for organisation-owned repositories - and rather than the
  # container, which adds a Docker Hub pull and its rate limit to every run.
  #
  # PINNED, deliberately. `latest` means a new release can turn a green pipeline
  # red overnight with no commit to blame, and gitleaks has renamed subcommands
  # across minor versions before. Bump it on purpose, having run it once.
  #
  # `.gitleaks.toml` at the repository root holds the exceptions, each one a
  # single string with a note saying why it is not a secret.
  # ---------------------------------------------------------------------------
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04

    env:
      GITLEAKS_VERSION: 8.30.0

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: gitleaks
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks version
          # `--config` named rather than left to discovery, and the commit count
          # echoed beside it: if a run scans FEWER commits than this, the history
          # walk stopped early and a clean result means nothing. `--no-merges`,
          # because gitleaks skips merge commits - their content is already in
          # the parents - so the raw total would be wrong by exactly the number
          # of merges and the check would cry wolf.
          echo "non-merge commits in history: $(git rev-list --count --no-merges HEAD)"
          ./gitleaks detect \
            --source=. \
            --config=.gitleaks.toml \
            --redact \
            --no-banner \
            --report-path=gitleaks-report.json \
            --exit-code=1

      # The findings, readable without admin rights on the repository.
      #
      # Job logs are admin-only through the API, so a failure here was
      # diagnosable only by somebody who could open the run in a browser. The
      # report is redacted - it says which rule fired, in which file, at which
      # line, and never prints the matched value.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Migration safety
  #
  # Advisory, deliberately. Migrations run BEFORE the new code starts, so for
  # the length of a rolling restart the old code runs against the new schema. A
  # dropped or renamed column throws on every request the old instances are
  # still serving; an added nullable one is harmless. No script can tell which
  # of those a given statement is in context - but it can make sure a human
  # looked. See docs/DEPLOYMENT.md section 15.5.
  # ---------------------------------------------------------------------------
  migration-review:
    name: Migration safety review
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Flag destructive statements in new migrations
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          files="$(git diff --name-only --diff-filter=A "$base" HEAD -- 'backend/prisma/migrations/**/*.sql')"

          if [ -z "$files" ]; then
            echo "No new migrations in this pull request."
            exit 0
          fi

          echo "New migrations:"
          echo "$files"
          echo

          # `|| true` on the grep: no match is the good case, and grep says so
          # with exit 1.
          found="$(grep -Ein 'DROP (TABLE|COLUMN)|RENAME|MODIFY|NOT NULL' $files || true)"

          if [ -n "$found" ]; then
            echo "::warning title=Destructive migration::These statements are not safe in a single release unless every existing row already satisfies them. Expand and contract over two releases - see docs/DEPLOYMENT.md section 15.5."
            echo "$found"
          else
            echo "Nothing destructive found."
          fi
