# =============================================================================
# Deploy to the VPS - build a release in GitHub, hand it to the server.
#
# Companion to deploy-vps/ (deploy-activate.sh, setup-deploy-user.sh and the
# beginner guide in deploy-vps/README.md). deploy.yml is left as it was.
#
# MANUAL ONLY. `workflow_dispatch` - no push deploys anything. It is for the
# systemd layout in Depoly_on_VPS.md (/srv/uboss). A Docker Compose install
# deploys on push with deploy-docker.yml instead. Production must have
# REQUIRED REVIEWERS set in Settings -> Environments; that approval is the
# only gate this workflow has.
#
# It never sends `.env` (that lives only in /srv/uboss/shared/.env on the
# server), never prints a secret, and has no `set -x`.
#
# BEFORE THE FIRST RUN (deploy-vps/README.md walks through each one)
#
#   Server:        sudo bash /srv/uboss/repo/deploy-vps/setup-deploy-user.sh
#   Environments:  staging, production (production: required reviewers)
#   Secrets:       DEPLOY_SSH_KEY, DEPLOY_HOST, DEPLOY_USER, DEPLOY_KNOWN_HOSTS
#   Variables:     CUSTOMER_API_BASE, ADMIN_API_BASE, LOGISTICS_API_BASE,
#                  CUSTOMER_SITE_URL, SMOKE_URL
#                  AUDIT_API_BASE (optional - the Audit Console is built and
#                  shipped only when it is set; see deploy-vps/README.md)
#
# The key is a dedicated ed25519 key for the `deploy` user, restricted on the
# server to one program:
#
#   restrict,command="/srv/uboss/bin/deploy-activate" ssh-ed25519 AAAA...
#
# HOW THE FILE GETS THERE
#
# Not scp. With a forced command, sshd runs deploy-activate instead of the scp
# or sftp server, so a copy never happens. The artifact and its checksum are
# streamed over stdin to `receive <name>` - which deploy-activate accepts only
# for names matching uboss-<40 hex>.tgz[.sha256].
# =============================================================================
name: Deploy to VPS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        required: true
        default: production
        type: choice
        options: [staging, production]

# The commit CI tested (automatic) or the one chosen (manual), and where it
# goes. An automatic run has no inputs, so it always means production.
env:
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  TARGET_ENV: ${{ inputs.environment || 'production' }}

# One deployment at a time, never cancelled halfway.
concurrency:
  group: deploy-vps-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build the release artifact
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The tested commit, not whatever main points at by now.
          ref: ${{ env.RELEASE_SHA }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      # VITE_* values are BAKED INTO THE BUNDLE at build time. A wrong one means
      # every visitor's browser calls an API on its own machine.
      - name: Build the front ends
        env:
          CUSTOMER_API_BASE: ${{ vars.CUSTOMER_API_BASE }}
          ADMIN_API_BASE: ${{ vars.ADMIN_API_BASE }}
          LOGISTICS_API_BASE: ${{ vars.LOGISTICS_API_BASE }}
          AUDIT_API_BASE: ${{ vars.AUDIT_API_BASE }}
          CUSTOMER_SITE_URL: ${{ vars.CUSTOMER_SITE_URL }}
        run: |
          set -euo pipefail
          for v in CUSTOMER_API_BASE ADMIN_API_BASE LOGISTICS_API_BASE CUSTOMER_SITE_URL; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is not set. Add it under Settings -> Secrets and variables -> Actions -> Variables."
              exit 1
            fi
          done

          ( cd apps/customer-web  && npm ci && VITE_API_BASE_URL="$CUSTOMER_API_BASE" VITE_PUBLIC_SITE_URL="$CUSTOMER_SITE_URL" npm run build )
          ( cd apps/admin-web     && npm ci && VITE_API_BASE_URL="$ADMIN_API_BASE"     npm run build )
          ( cd apps/logistics-web && npm ci && VITE_API_BASE_URL="$LOGISTICS_API_BASE" npm run build )

          # The Audit Console is optional, like FEATURE_AUDIT_CONSOLE on the API.
          # No AUDIT_API_BASE means this installation does not use it: nothing
          # is built, and deploy-activate.sh accepts a release without it.
          if [ -n "$AUDIT_API_BASE" ]; then
            ( cd apps/audit-web   && npm ci && VITE_API_BASE_URL="$AUDIT_API_BASE"     npm run build )
          else
            echo "AUDIT_API_BASE is not set - not building the Audit Console."
          fi

      - name: Build the API
        # prisma generate reads prisma.config.ts, which refuses to load without a
        # DATABASE_URL. Generating the client never connects, so a placeholder is
        # enough; the real address lives only in the server's .env.
        env:
          DATABASE_URL: mysql://build:unused@127.0.0.1:3306/unused
        run: |
          set -euo pipefail
          cd backend
          npm ci
          npx prisma generate
          npm run build

      # Source maps are the full source of the admin console and carrier portal.
      - name: Strip front-end source maps
        run: |
          find apps/*/dist -name '*.map' -delete
          find apps/*/dist -name '*.js' -exec sed -i 's|^//# sourceMappingURL=.*$||' {} +

      # prisma.config.ts is required: Prisma 7 has no `url` in the schema.
      - name: Package and checksum
        run: |
          set -euo pipefail
          optional=()
          if [ -d apps/audit-web/dist ]; then optional+=(apps/audit-web/dist); fi
          tar -czf "uboss-${RELEASE_SHA}.tgz" \
            backend/dist backend/prisma backend/prisma.config.ts \
            backend/package.json backend/package-lock.json \
            apps/customer-web/dist apps/admin-web/dist apps/logistics-web/dist \
            "${optional[@]}"
          sha256sum "uboss-${RELEASE_SHA}.tgz" > "uboss-${RELEASE_SHA}.tgz.sha256"
          cat "uboss-${RELEASE_SHA}.tgz.sha256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vps-release-${{ env.RELEASE_SHA }}
          path: uboss-*.tgz*
          retention-days: 30

  deploy:
    name: Activate on ${{ inputs.environment || 'production' }}
    needs: build
    runs-on: ubuntu-24.04

    # The approval gate - required reviewers on `production`.
    environment: ${{ inputs.environment || 'production' }}

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: vps-release-${{ env.RELEASE_SHA }}

      # Pinned host key, never accept-new: the first machine to answer on that
      # address would otherwise receive the release.
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          for v in DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS DEPLOY_HOST DEPLOY_USER; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret $v is not set for the '$TARGET_ENV' environment."
              exit 1
            fi
          done
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY"     > ~/.ssh/uboss_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/uboss_deploy ~/.ssh/known_hosts

      - name: Upload and activate
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          SSH=(ssh -i ~/.ssh/uboss_deploy -o IdentitiesOnly=yes -o BatchMode=yes
               -o StrictHostKeyChecking=yes -o ServerAliveInterval=30
               "$DEPLOY_USER@$DEPLOY_HOST")
          NAME="uboss-${RELEASE_SHA}.tgz"

          "${SSH[@]}" "receive $NAME.sha256" < "$NAME.sha256"
          "${SSH[@]}" "receive $NAME"        < "$NAME"

          # Verifies the checksum, unpacks, backs up if there are migrations,
          # migrates, swaps, restarts one API at a time, and rolls itself back
          # if the new release fails its health checks.
          "${SSH[@]}" "activate $NAME"

      # From outside the machine, against the public address - a script that
      # declares itself healthy is not evidence.
      - name: Smoke test
        env:
          SMOKE_URL: ${{ vars.SMOKE_URL }}
        run: |
          set -euo pipefail
          if [ -z "$SMOKE_URL" ]; then
            echo "::error::SMOKE_URL is required for every deployment."
            exit 1
          fi
          curl -fsS --max-time 10 "${SMOKE_URL%/}/health/live"  >/dev/null
          curl -fsS --max-time 20 "${SMOKE_URL%/}/health/ready" >/dev/null
          echo "health checks pass"
