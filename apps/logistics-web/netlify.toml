# =============================================================================
# Netlify - the logistics partner portal
#
# Read the header of apps/customer-web/netlify.toml first: why this is a proxy
# and not an absolute API URL in the bundle is explained there once, and it
# applies identically here.
#
# ONE THING TO CHANGE: API_ORIGIN, in the [[redirects]] block below.
#
# The [[redirects]] block below points at this installation's API. Replace
# that hostname, scheme included and no trailing slash, to point this site at
# a different one.
#
# A SITE OF ITS OWN IS THE POINT, NOT AN INCONVENIENCE.
#
# This portal is signed into by carriers - people outside the operator's
# company. That is the whole reason it is a third application rather than a
# section of the console, and it is why it gets its own Netlify site and its
# own hostname. Serving it under the storefront is a development arrangement
# for showing all three through one tunnel; nothing outside development should
# reproduce it.
#
# WHAT THE API SIDE NEEDS
#
#   COOKIE_SECURE=true        Netlify is HTTPS. Without it a carrier's sign-in
#                             appears to succeed and then does nothing.
#   LOGISTICS_WEB_ORIGIN      This site's URL, added to the comma-separated
#                             allowlist.
#   LOGISTICS_WEB_PUBLIC_URL  The same URL. Carrier invitation emails link to
#                             it; left at localhost, nobody can accept one.
# =============================================================================

# >>> BUILD SETTINGS - GIT-CONNECTED SITES ONLY. pack-netlify.ps1 CUTS FROM HERE.
#
# Removed by `scripts/pack-netlify.ps1` when it writes this file into a zip.
# A manual zip deploy reads this netlify.toml in full, build command included,
# and the zip holds the built site rather than the source - so Netlify would
# fail the deploy with `Command failed with exit code 254: npm run
# build:netlify` and publish nothing. See the storefront's netlify.toml for the
# long version. The markers are a pair.
[build]
  # Relative to this directory when the site's "Base directory" is set to
  # `apps/logistics-web` in Netlify. Set it there.
  command = "npm run build:netlify"
  publish = "dist"

[build.environment]
  # The repository pins 24 in .nvmrc, and package.json refuses anything lower.
  NODE_VERSION = "24"
# <<< BUILD SETTINGS END. pack-netlify.ps1 CUTS TO HERE.

# -----------------------------------------------------------------------------
# Redirects. ORDER MATTERS: Netlify takes the FIRST rule that matches, so the
# single-page-application catch-all stays last. A rule added below it is dead,
# and it is dead silently.
# -----------------------------------------------------------------------------

# The API. `200` is a proxy, not a redirect: the browser never learns the API's
# hostname, the request stays same-origin, and the session and CSRF cookies
# ride along. A `301` would send the browser to the other host and lose them.
[[redirects]]
  from = "/api/*"
  to = "https://refold-barley-playing.ngrok-free.dev/api/:splat"
  status = 200
  force = true

# The single-page application. Without this, a reload on /shipments is a 404
# from Netlify - the page only ever worked because you navigated to it.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# -----------------------------------------------------------------------------
# Headers. These mirror deploy/nginx/snippets/uboss-security-headers.conf, which
# is what an installation on its own server gets. Change one, change the other.
# -----------------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(self), microphone=(self), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), interest-cohort=()"

    # REPORT-ONLY, deliberately, exactly as the nginx snippet ships it. A CSP
    # one directive short blanks the page rather than degrading. Watch the
    # reports for a day - including a proof-of-delivery upload - before
    # renaming this to `Content-Security-Policy`.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; media-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"

# Vite fingerprints everything in /assets, so a file at a given URL never
# changes. Cache it for a year and let the filename do the invalidating.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html is NOT fingerprinted - it names which fingerprinted bundle to
# load. Cached, it keeps pointing at the previous deploy's files, which no
# longer exist: a blank portal after a release, until somebody hard-refreshes.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
