<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The colour of the mobile browser's own toolbar. The dark surface,
         because dark is the default palette; ThemeProvider rewrites this to
         white when somebody chooses the light one. -->
    <meta name="theme-color" content="#141e30" />
    <!-- Per-route title and description are set at runtime; this is the
         fallback a crawler sees before the app boots. -->
    <title>Gloviaa Mart</title>
    <meta
      name="description"
      content="Industrial and business supplies, sourced and delivered. Browse the catalogue, order online and set up repeat purchases."
    />
    <!-- What a shared link previews with, for the fetchers that read this file
         and never run the app (chat apps, social networks). The app replaces
         these with each page's own the moment it starts; see applySeoTags in
         src/lib/seo.ts, which removes everything marked data-seo-static. -->
    <meta data-seo-static property="og:type" content="website" />
    <meta data-seo-static property="og:site_name" content="Gloviaa Mart" />
    <meta data-seo-static property="og:title" content="Gloviaa Mart" />
    <meta
      data-seo-static
      property="og:description"
      content="Industrial and business supplies, sourced and delivered. Browse the catalogue, order online and set up repeat purchases."
    />
    <meta data-seo-static name="twitter:card" content="summary" />
    <!--
      The theme, before the first paint.

      This has to be inline, blocking, and in the head. React mounts after the
      document has been painted once, so a visitor who has chosen dark would
      otherwise get a white flash on every single page load - the one bug that
      makes a dark theme feel bolted on. Six lines of blocking script in the
      head is the whole fix, and it is the reason src/app/ThemeProvider.tsx
      does not try to do this job itself.

      With no stored choice (a first visit, or storage refused) it stamps
      "dark": dark is the default palette. It writes nothing only when the
      stored choice is "system": the absence of `data-theme` is what hands
      the decision to the `prefers-color-scheme` block in index.css, and
      writing the resolved value there would freeze a visitor into whichever
      theme their machine happened to be in at that moment.

      `uboss.theme` and these three values are shared with
      src/app/ThemeProvider.tsx. Change both or neither.
    -->
    <script>
      try {
        var t = localStorage.getItem('uboss.theme');
        if (t !== 'system') document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
      } catch (e) {
        /* Storage refused. Dark, the default, still applies. */
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 2rem; font-family: system-ui, sans-serif">
        This site needs JavaScript to browse the catalogue and place orders.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
