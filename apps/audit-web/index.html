<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      An audit console must never be indexed, however it ends up exposed. The
      same line the admin console carries, and for the same reason: everything
      behind it is a seller's compliance record.
    -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Gloviaa Mart Audit Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!--
      The theme, before the first paint. Identical to the console's, and for
      the same reason: React mounts after the document has been painted once,
      so without this an inspector who has chosen dark gets a white flash on
      every page load.

      With no stored choice it stamps "dark", the default palette. Nothing is
      written only when the choice is "system": the absence of `data-theme`
      is what hands the decision to the `prefers-color-scheme` block in
      index.css.

      `uboss.theme` and these three values are shared with
      src/app/ThemeProvider.tsx. Change both or neither.
    -->
    <script>
      try {
        var t = localStorage.getItem('uboss.theme');
        if (t !== 'system') document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
      } catch (e) {
        /* Storage refused. Dark, the default, still applies. */
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
